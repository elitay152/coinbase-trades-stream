apiVersion: 1

datasources:
  - name: Candles
    uid: candles-pg
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
    isDefault: true